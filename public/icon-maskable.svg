<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable shape clipping -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Centered inside 80% safe-zone (Scale 0.76) -->
  <g transform="translate(61.44, 61.44) scale(0.76)">
    <!-- Back Card -->
    <g transform="rotate(-12 256 256)">
      <rect x="136" y="116" width="240" height="300" rx="28" fill="url(#cardBackGrad)" opacity="0.75" stroke="#a5b4fc" stroke-width="4" stroke-opacity="0.4" />
      <line x1="176" y1="176" x2="336" y2="176" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6" />
      <line x1="176" y1="216" x2="296" y2="216" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4" />
    </g>

    <!-- Front Card -->
    <g transform="rotate(6 256 256)">
      <rect x="136" y="116" width="240" height="300" rx="28" fill="url(#cardFrontGrad)" stroke="#ffffff" stroke-width="5" stroke-opacity="0.6" />
      
      <!-- Anki Star / Flashcard Symbol -->
      <path d="M256 186 L267 220 L303 220 L274 241 L285 275 L256 254 L227 275 L238 241 L209 220 L245 220 Z" fill="url(#starGrad)" />
      
      <!-- Lines on card -->
      <line x1="176" y1="310" x2="336" y2="310" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
      <line x1="176" y1="340" x2="280" y2="340" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round" />
      
      <!-- SM-2 Repetition Badge -->
      <rect x="296" y="330" width="40" height="20" rx="10" fill="#10b981" />
      <circle cx="316" cy="340" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>
